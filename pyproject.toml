[project]
name = "hiremind"
version = "0.1.0"
description = "AI 智能面试官平台 - 基于 LangChain/LangGraph 的简历分析、模拟面试和 RAG 知识库系统"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # 数据库
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.0",
    "pgvector>=0.3.0",

    # Redis
    "redis[hiredis]>=5.2.0",

    # AI
    "langchain>=0.3.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-openai>=0.2.0",

    # 配置
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",

    # 安全
    "python-jose[cryptography]>=3.3.0",

    # 对象存储
    "boto3>=1.35.0",

    # 文档解析
    "tika-client>=0.5.0",
    "python-docx>=1.1.0",
    "PyMuPDF>=1.24.0",

    # PDF 导出
    "weasyprint>=62.0",

    # HTTP 客户端
    "httpx>=0.27.0",

    # WebSocket
    "websockets>=14.0",

    # 语音（阿里云百炼）
    "dashscope>=1.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.12"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
